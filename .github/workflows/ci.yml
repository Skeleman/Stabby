name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release -v q
      - run: dotnet test -c Release --no-build
      - run: dotnet run --project tools/Stabby.Lint -c Release --no-build
      - run: dotnet run --project tools/Stabby.Cli -c Release --no-build -- sweep --count 100 --size 256
      - run: dotnet run --project tools/Stabby.Cli -c Release --no-build -- sweep --count 10 --size 512
