name: ci
on:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release -v q
      - run: dotnet test -c Release --no-build --filter "FullyQualifiedName~Feature|FullyQualifiedName~Object|FullyQualifiedName~Discover"
      - run: dotnet run --project tools/Stabby.Lint -c Release --no-build
      - run: dotnet run --project tools/Stabby.Cli -c Release --no-build -- sweep --count 100 --size 256
